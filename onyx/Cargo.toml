[package]
name = "onyx"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.25", default-features = false, features = ["glow", "default_fonts"] } # eframe includes egui
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"